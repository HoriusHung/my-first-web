<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descriptive Statistics Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Descriptive Statistics Calculator</h1>

    <label for="input">Enter numbers:</label>
    <textarea id="input" rows="5" placeholder="Example: 2, 4, 4, 4, 5, 5, 7, 9"></textarea>
    <p class="note">Period (.) is the decimal separator. Numbers are separated by spaces, commas, semicolons, or newlines.</p>

    <div class="actions">
      <button id="btnCalc" type="button">Calculate</button>
      <button id="btnClear" type="button" class="secondary">Clear</button>
    </div>

    <p id="error" class="error" role="alert"></p>
    <p id="parsedLine" class="parsed"></p>

    <table id="resultTable" class="result" hidden>
      <tbody>
        <tr><th>Count (n)</th><td id="r_n"></td></tr>
        <tr><th>Sum</th><td id="r_sum"></td></tr>
        <tr><th>Mean</th><td id="r_mean"></td></tr>
        <tr><th>Median</th><td id="r_median"></td></tr>
        <tr><th>Mode</th><td id="r_mode"></td></tr>
        <tr><th>Minimum (min)</th><td id="r_min"></td></tr>
        <tr><th>Maximum (max)</th><td id="r_max"></td></tr>
        <tr><th>Range</th><td id="r_range"></td></tr>
        <tr><th>Population variance</th><td id="r_var_pop"></td></tr>
        <tr><th>Population standard deviation</th><td id="r_std_pop"></td></tr>
        <tr><th>Sample variance</th><td id="r_var_sample"></td></tr>
        <tr><th>Sample standard deviation</th><td id="r_std_sample"></td></tr>
      </tbody>
    </table>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
